
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&family=Noto+Serif+TC:wght@300;400&family=Noto+Sans+TC:wght@300;400&display=swap');

.bc-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2rem;
  padding: 2.5rem 1rem 2rem;
  background: #141414;
  border-radius: 12px;
}
.bc-label {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  text-align: center;
}
.bc-scene {
  perspective: 1200px;
  width: 360px;
  height: 228px;
  cursor: pointer;
}
.bc-card {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.75s cubic-bezier(0.76,0,0.24,1);
  border-radius: 5px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 4px 16px rgba(0,0,0,0.5);
}
.bc-card.flipped { transform: rotateY(180deg); }
.bc-face {
  position: absolute; inset: 0;
  border-radius: 5px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
}
.bc-back-face { transform: rotateY(180deg); }

/* FRONT */
.bc-front { background: #080808; border: 0.5px solid rgba(196,151,58,0.18); }
.bc-front-vline {
  position: absolute; left: 16px; top: 0; bottom: 0; width: 1px;
  background: linear-gradient(to bottom, transparent 0%, rgba(196,151,58,0.55) 20%, rgba(196,151,58,0.55) 80%, transparent 100%);
}
.bc-front-corner-tl {
  position: absolute; top: 13px; left: 22px;
  width: 13px; height: 13px;
  border-top: 0.5px solid rgba(196,151,58,0.45);
  border-left: 0.5px solid rgba(196,151,58,0.45);
}
.bc-front-tag {
  position: absolute; top: 16px; right: 16px;
  font-family: 'DM Sans', sans-serif;
  font-size: 5.5px; font-weight: 400;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: #c4973a; text-align: right; line-height: 1.7;
}
.bc-front-main { position: absolute; left: 32px; top: 50%; transform: translateY(-52%); }
.bc-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px; font-weight: 300;
  letter-spacing: 0.32em; color: #ffffff;
  text-transform: uppercase; line-height: 1; margin-bottom: 7px;
}
.bc-rule { width: 28px; height: 1px; background: #c4973a; margin-bottom: 8px; }
.bc-name-en {
  font-family: 'DM Sans', sans-serif;
  font-size: 8px; font-weight: 400;
  letter-spacing: 0.08em; color: #f5f0e8; margin-bottom: 3px;
}
.bc-name-zh {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 7.5px; font-weight: 300;
  color: rgba(255,255,255,0.45); letter-spacing: 0.06em;
}
.bc-front-contact {
  position: absolute; right: 16px; bottom: 18px;
  text-align: right;
  display: flex; flex-direction: column; gap: 3px;
}
.bc-contact-line {
  display: flex; align-items: center;
  justify-content: flex-end; gap: 6px;
  font-family: 'DM Sans', sans-serif;
  font-size: 6.5px; font-weight: 300;
  color: rgba(255,255,255,0.46); letter-spacing: 0.04em;
}
.bc-dash { width: 9px; height: 1px; background: rgba(196,151,58,0.42); flex-shrink: 0; }
.bc-front-addr {
  position: absolute; left: 32px; bottom: 16px;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 5px; font-weight: 300;
  color: rgba(255,255,255,0.2); letter-spacing: 0.06em; line-height: 1.6;
}

/* BACK */
.bc-back-inner {
  display: flex; width: 100%; height: 100%;
  background: #080808;
  border: 0.5px solid rgba(196,151,58,0.18);
  border-radius: 5px; overflow: hidden;
}
.bc-gold-panel {
  width: 42%; background: #c4973a;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 0 14px; flex-shrink: 0;
}
.bc-gold-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px; font-weight: 300;
  letter-spacing: 0.30em; color: #080808;
  text-transform: uppercase; line-height: 1; text-align: center;
}
.bc-gold-rule { width: 20px; height: 1px; background: rgba(8,8,8,0.25); margin: 6px auto; }
.bc-gold-slogan {
  font-family: 'Cormorant Garamond', serif;
  font-size: 7px; font-weight: 300; font-style: italic;
  color: rgba(8,8,8,0.56); text-align: center; line-height: 1.65; letter-spacing: 0.01em;
}
.bc-dark-panel {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 9px; padding: 0 14px; position: relative;
}
.bc-pills { display: flex; gap: 5px; }
.bc-pill {
  font-family: 'DM Sans', sans-serif;
  font-size: 5.5px; font-weight: 400;
  letter-spacing: 0.13em; padding: 2px 6px; border-radius: 20px;
}
.bc-pill-imp { color: rgba(210,100,100,0.85); border: 0.5px solid rgba(210,100,100,0.38); }
.bc-pill-exp { color: rgba(80,175,115,0.85); border: 0.5px solid rgba(80,175,115,0.38); }
.bc-back-company {
  font-family: 'Noto Serif TC', serif;
  font-size: 9px; font-weight: 400;
  color: #f5f0e8; letter-spacing: 0.04em;
  text-align: center; line-height: 1.5;
}
.bc-back-tong {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 6.5px; font-weight: 300;
  color: rgba(255,255,255,0.32); letter-spacing: 0.08em;
  text-align: center;
}
.bc-back-corner-br {
  position: absolute; bottom: 12px; right: 14px;
  width: 12px; height: 12px;
  border-bottom: 0.5px solid rgba(196,151,58,0.35);
  border-right: 0.5px solid rgba(196,151,58,0.35);
}

/* Controls */
.bc-hint {
  font-size: 11px; color: rgba(255,255,255,0.25);
  font-family: 'DM Sans', sans-serif; font-weight: 300; letter-spacing: 0.06em;
}
.bc-toggle { display: flex; gap: 8px; }
.bc-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 10px; font-weight: 400;
  letter-spacing: 0.14em; text-transform: uppercase;
  padding: 6px 20px; background: transparent;
  color: rgba(255,255,255,0.4);
  border: 0.5px solid rgba(255,255,255,0.18);
  cursor: pointer; transition: all 0.25s; border-radius: 2px;
}
.bc-btn:hover { color: #c4973a; border-color: rgba(196,151,58,0.45); }
.bc-btn.on { color: #c4973a; border-color: #c4973a; }
</style>

<div class="bc-wrap">
  <div class="bc-label">TURCO — Kartvizit Önizleme · Tıklayarak çevir</div>

  <div class="bc-scene" onclick="flip()">
    <div class="bc-card" id="bcard">

      <!-- FRONT -->
      <div class="bc-face bc-front">
        <div class="bc-front-vline"></div>
        <div class="bc-front-corner-tl"></div>
        <div class="bc-front-tag">Cross-Border<br>Food Trade</div>
        <div class="bc-front-main">
          <div class="bc-logo">TURCO</div>
          <div class="bc-rule"></div>
          <div class="bc-name-en">Yasin Can Turak</div>
          <div class="bc-name-zh">黃亞興</div>
        </div>
        <div class="bc-front-contact">
          <div class="bc-contact-line">+886 0979 069 914<span class="bc-dash"></span></div>
          <div class="bc-contact-line">yasintw@gmail.com<span class="bc-dash"></span></div>
          <div class="bc-contact-line">LINE &nbsp;@turco<span class="bc-dash"></span></div>
          <div class="bc-contact-line">turco.tw<span class="bc-dash"></span></div>
        </div>
        <div class="bc-front-addr">臺北市中山區南京東路1段25號9樓之1</div>
      </div>

      <!-- BACK -->
      <div class="bc-face bc-back-face">
        <div class="bc-back-inner">
          <div class="bc-gold-panel">
            <div class="bc-gold-logo">TURCO</div>
            <div class="bc-gold-rule"></div>
            <div class="bc-gold-slogan">Connecting Taiwan<br>with Global Food Markets</div>
          </div>
          <div class="bc-dark-panel">
            <div class="bc-pills">
              <div class="bc-pill bc-pill-imp">進口 IMPORT</div>
              <div class="bc-pill bc-pill-exp">出口 EXPORT</div>
            </div>
            <div class="bc-back-company">亞興國際企業有限公司</div>
            <div class="bc-back-tong">統編 91082120</div>
            <div class="bc-back-corner-br"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="bc-hint">↑ Kartı tıklayarak çevir</div>
  <div class="bc-toggle">
    <button class="bc-btn on" id="btn-f" onclick="showFront()">Ön Yüz</button>
    <button class="bc-btn" id="btn-b" onclick="showBack()">Arka Yüz</button>
  </div>
</div>

<script>
let flipped = false;
function flip() {
  flipped = !flipped;
  document.getElementById('bcard').classList.toggle('flipped', flipped);
  document.getElementById('btn-f').classList.toggle('on', !flipped);
  document.getElementById('btn-b').classList.toggle('on', flipped);
}
function showFront() { if(flipped) flip(); }
function showBack() { if(!flipped) flip(); }
</script>
